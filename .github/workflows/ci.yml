name: ci

# Green on every commit is the bar a client engineering lead expects (R-52).
# The engine has no runtime dependencies, so CI installs the package itself and
# runs the suite against the installed distribution, not the source tree.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Confirm the package imports with no third-party dependency
        run: |
          python -c "import dpre; print(dpre.__version__)"
          python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["dependencies"] == [], "runtime must stay stdlib-only"
          PY
      - name: Run the suite
        run: python -m pytest tests -q

  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q dpre tests
      - name: pyflakes if it is available, compileall otherwise
        run: |
          if python -m pip install "pyflakes>=3.2,<4.0"; then
            python -m pyflakes dpre tests
          else
            echo "pyflakes unavailable; compileall above is the gate"
          fi

  smoke:
    name: end-to-end run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: One automated run must complete and stay reproducible
        run: |
          dpre --db "${RUNNER_TEMP}/engine.db" run automated --industry banking \
            --workspace "${RUNNER_TEMP}/ws" --json "${RUNNER_TEMP}/run.json"
          python -c "import json,sys;d=json.load(open(sys.argv[1]));assert d['run_id']" \
            "${RUNNER_TEMP}/run.json"
