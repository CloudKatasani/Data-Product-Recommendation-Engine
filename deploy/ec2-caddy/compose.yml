# EC2 + Caddy deployment: Caddy terminates TLS and authenticates the user,
# the engine trusts only Caddy's fixed address. See docs/deploy-ec2-caddy.md.
name: dpre

services:
  dpre:
    build:
      context: ../..
    image: dpre:local
    restart: unless-stopped
    environment:
      DPRE_HOST: 0.0.0.0              # non-loopback: the dev identity header is disabled
      DPRE_PORT: "8000"
      DPRE_WORKSPACE: /var/lib/dpre
      DPRE_TRUSTED_PROXY: 172.30.0.10 # Caddy's address below, and nothing else
      DPRE_ALLOWED_HOSTS: ${DPRE_DOMAIN:?set DPRE_DOMAIN in .env}
      DPRE_MAX_UPLOAD_MB: "64"
      DPRE_LOG_FORMAT: json
    volumes:
      - dpre-data:/var/lib/dpre
    networks:
      edge:
        ipv4_address: 172.30.0.20
    # No ports: the engine is reachable only through Caddy.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [dpre]
    environment:
      DPRE_DOMAIN: ${DPRE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.10

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  dpre-data:
  caddy-data:
  caddy-config:
